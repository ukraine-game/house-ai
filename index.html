<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FindHome AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070a10;
    --bg2:#0c111a;
    --card:#111823;
    --card2:#151e2b;
    --line:#202b3b;
    --text:#f5f7fb;
    --muted:#8d99aa;
    --blue:#6d8cff;
    --blue2:#879cff;
    --green:#35d399;
    --yellow:#fbbf24;
    --red:#fb7185;
}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at 20% 0%,#1c294a 0,#070a10 38%);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    width:100%;
    max-width:680px;
    margin:auto;
    min-height:100vh;
    padding-bottom:90px;
}

.topbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    font-size:22px;
    font-weight:850;
    letter-spacing:-.7px;
}

.logo span{
    color:var(--blue2);
}

.ai-status{
    border:1px solid var(--line);
    background:#101827;
    padding:7px 11px;
    border-radius:999px;
    font-size:12px;
    color:var(--muted);
}

.ai-status.ready{
    color:var(--green);
}

.page{
    padding:8px 18px 30px;
}

.hero{
    padding:15px 0 16px;
}

.eyebrow{
    color:var(--muted);
    font-size:13px;
    margin-bottom:5px;
}

h1{
    font-size:32px;
    line-height:1.05;
    letter-spacing:-1.3px;
    margin:0;
}

h2{
    margin:0;
    font-size:20px;
}

h3{
    margin:0;
}

p{
    line-height:1.5;
}

.muted{
    color:var(--muted);
}

.row{
    display:flex;
    align-items:center;
}

.between{
    justify-content:space-between;
}

.gap{
    gap:9px;
}

.search{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.input{
    width:100%;
    background:#0d131d;
    border:1px solid var(--line);
    border-radius:15px;
    padding:14px;
    color:var(--text);
    outline:none;
}

.input:focus{
    border-color:#526ed8;
}

.btn{
    min-height:46px;
    padding:0 16px;
    border-radius:14px;
    background:var(--blue);
    color:#fff;
    font-weight:750;
}

.btn.secondary{
    background:#192332;
}

.btn.outline{
    background:transparent;
    border:1px solid var(--line);
}

.btn.danger{
    background:#351720;
    color:#ff9aaa;
}

.btn.full{
    width:100%;
}

.live-launch{
    width:100%;
    padding:17px;
    border-radius:17px;
    background:
        linear-gradient(135deg,#6683ff,#8b6dff);
    color:white;
    font-weight:800;
    font-size:16px;
    box-shadow:0 12px 35px #526bd933;
}

.section{
    margin-top:25px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:11px;
}

.small-btn{
    background:#121b29;
    color:#dbe2ee;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 11px;
    font-size:12px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    background:
        linear-gradient(145deg,#131b27,#0d131c);
    border:1px solid var(--line);
    border-radius:19px;
    padding:16px;
}

.room{
    min-height:130px;
    transition:.18s;
}

.room:active{
    transform:scale(.98);
}

.room-icon{
    font-size:29px;
}

.room-title{
    margin-top:13px;
    font-weight:750;
}

.room-count{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

.list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:15px;
    padding:11px;
}

.item:active{
    transform:scale(.99);
}

.thumb{
    width:52px;
    height:52px;
    border-radius:13px;
    display:grid;
    place-items:center;
    flex:none;
    background:#1b2534;
    font-size:24px;
    overflow:hidden;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.item-info{
    min-width:0;
    flex:1;
}

.item-title{
    font-weight:750;
    font-size:15px;
}

.item-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.arrow{
    color:#69768a;
    font-size:22px;
}

.empty{
    text-align:center;
    padding:35px 12px;
    color:var(--muted);
}

.fab{
    position:fixed;
    right:20px;
    bottom:86px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--blue),#926dff);
    color:#fff;
    font-size:27px;
    box-shadow:0 14px 35px #0008;
    z-index:5;
}

.bottom-nav{
    position:fixed;
    z-index:8;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(680px,100%);
    height:74px;
    padding:6px 6px env(safe-area-inset-bottom);
    display:flex;
    justify-content:space-around;
    background:#0b1019ed;
    border-top:1px solid var(--line);
    backdrop-filter:blur(18px);
}

.bottom-nav button{
    background:none;
    color:#707c90;
    min-width:60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:10px;
}

.bottom-nav button.active{
    color:white;
}

.bottom-nav .nav-icon{
    font-size:21px;
}

.modal{
    position:fixed;
    z-index:50;
    inset:0;
    background:#0009;
    display:none;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.sheet{
    width:min(680px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111823;
    border:1px solid var(--line);
    border-radius:25px 25px 0 0;
    padding:20px;
}

.sheet-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:16px;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:6px;
}

.field textarea{
    resize:vertical;
    min-height:90px;
}

.actions{
    display:flex;
    gap:9px;
    margin-top:16px;
}

.actions>*{
    flex:1;
}

.toast{
    position:fixed;
    z-index:100;
    left:50%;
    bottom:92px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    background:#1b2534;
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px 15px;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.onboarding{
    position:fixed;
    z-index:200;
    inset:0;
    display:none;
    place-items:center;
    padding:25px;
    background:
        radial-gradient(circle at 50% 15%,#293969,#070a10 58%);
}

.onboarding.show{
    display:grid;
}

.onboarding-box{
    width:min(470px,100%);
    text-align:center;
}

.home-logo{
    width:90px;
    height:90px;
    margin:auto auto 18px;
    display:grid;
    place-items:center;
    border-radius:27px;
    background:linear-gradient(135deg,var(--blue),#936eff);
    font-size:50px;
    box-shadow:0 20px 55px #526bd955;
}

.onboarding h1{
    font-size:37px;
}

.onboarding p{
    color:var(--muted);
}

.onboarding input{
    margin-top:13px;
    width:100%;
    background:#0c121c;
    border:1px solid var(--line);
    color:white;
    padding:16px;
    border-radius:15px;
    outline:none;
}

.onboarding .btn{
    width:100%;
    margin-top:9px;
}

.setting{
    min-height:57px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
}

.switch{
    width:49px;
    height:28px;
    padding:3px;
    border-radius:99px;
    background:#293342;
    transition:.2s;
}

.switch i{
    display:block;
    width:22px;
    height:22px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

.switch.on{
    background:var(--blue);
}

.switch.on i{
    transform:translateX(21px);
}

.progress{
    height:6px;
    background:#202a38;
    border-radius:10px;
    overflow:hidden;
}

.progress i{
    display:block;
    height:100%;
    background:linear-gradient(90deg,var(--blue),#9b72ff);
}

.history-photo{
    width:100%;
    border-radius:14px;
    margin-top:12px;
    max-height:250px;
    object-fit:cover;
}

/* LIVE */

.live{
    position:fixed;
    z-index:150;
    inset:0;
    background:#000;
    display:none;
}

.live.show{
    display:block;
}

.camera{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.live-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.live-top{
    position:absolute;
    top:max(16px,env(safe-area-inset-top));
    left:14px;
    right:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:auto;
}

.live-back{
    background:#0b111bd9;
    border:1px solid #ffffff22;
    color:white;
    border-radius:13px;
    padding:11px 14px;
}

.live-status{
    background:#0b111bd9;
    border:1px solid #ffffff22;
    padding:8px 11px;
    border-radius:999px;
    font-size:12px;
}

.live-status.green{
    color:#5df0b0;
}

.live-status.yellow{
    color:#ffd36a;
}

.detection{
    position:absolute;
    border:2px solid #71a0ff;
    border-radius:10px;
    box-shadow:
        0 0 0 1px #0007,
        0 0 20px #6d8cff66;
    transition:
        left .1s linear,
        top .1s linear,
        width .1s linear,
        height .1s linear;
}

.detection.low{
    border-color:#fbbf24;
}

.detection-label{
    position:absolute;
    top:-32px;
    left:-2px;
    padding:6px 8px;
    border-radius:8px;
    white-space:nowrap;
    color:white;
    background:#0a1019e8;
    border:1px solid #ffffff2b;
    font-size:12px;
    font-weight:700;
}

.detection-label span{
    color:#8eb0ff;
}

.live-bottom{
    position:absolute;
    left:14px;
    right:14px;
    bottom:max(20px,env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
    gap:9px;
    pointer-events:auto;
}

.live-btn{
    background:#0b111be8;
    color:white;
    border:1px solid #ffffff25;
    border-radius:14px;
    padding:13px 16px;
    font-weight:700;
}

.live-btn.primary{
    background:var(--blue);
}

.live-message{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translateX(-50%);
    background:#070b12d9;
    border:1px solid #ffffff1e;
    border-radius:12px;
    padding:9px 12px;
    font-size:12px;
    white-space:nowrap;
}

.model-progress{
    position:absolute;
    left:20px;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    background:#090d14e8;
    border:1px solid #ffffff22;
    padding:20px;
    border-radius:18px;
    text-align:center;
    display:none;
}

.model-progress.show{
    display:block;
}

.model-progress .progress{
    margin-top:13px;
}

@media(max-width:430px){
    .page{
        padding-left:14px;
        padding-right:14px;
    }

    .topbar{
        padding-left:14px;
        padding-right:14px;
    }

    h1{
        font-size:29px;
    }

    .grid{
        gap:8px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
    <div class="logo">FindHome <span>AI</span></div>
    <div id="globalAI" class="ai-status">● AI завантаження</div>
</header>

<main id="main"></main>

</div>

<nav class="bottom-nav">

<button data-page="home" onclick="navigate('home')">
    <span class="nav-icon">⌂</span>
    Головна
</button>

<button data-page="live" onclick="openLive()">
    <span class="nav-icon">◉</span>
    AI-Live
</button>

<button data-page="objects" onclick="navigate('objects')">
    <span class="nav-icon">□</span>
    Предмети
</button>

<button data-page="history" onclick="navigate('history')">
    <span class="nav-icon">◷</span>
    Історія
</button>

<button data-page="settings" onclick="navigate('settings')">
    <span class="nav-icon">⚙</span>
    Налаштування
</button>

</nav>

<button id="fab" class="fab" onclick="quickAdd()">＋</button>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
    <div id="sheet" class="sheet"></div>
</div>

<div id="toast" class="toast"></div>

<div id="onboarding" class="onboarding">

    <div class="onboarding-box">

        <div class="home-logo">⌂</div>

        <h1>FindHome AI</h1>

        <p>
            Розумний помічник, який допомагає пам'ятати,
            де знаходяться твої речі.
        </p>

        <input
            id="firstHomeName"
            placeholder="Наприклад: Мій дім"
            autocomplete="off"
        >

        <button class="btn" onclick="createFirstHome()">
            Створити дім
        </button>

    </div>

</div>

<!-- AI LIVE -->

<div id="live" class="live">

    <video
        id="camera"
        class="camera"
        autoplay
        playsinline
        muted>
    </video>

    <div id="liveOverlay" class="live-overlay">

        <div class="live-top">

            <button class="live-back" onclick="closeLive()">
                ← Назад
            </button>

            <div id="liveStatus" class="live-status">
                ● LIVE
            </div>

        </div>

    </div>

    <div id="liveMessage" class="live-message">
        Наведи камеру на предмети
    </div>

    <div id="modelProgress" class="model-progress">

        <b>Завантаження AI-моделі</b>

        <div class="muted" style="margin-top:6px">
            Перший запуск може зайняти трохи часу.
        </div>

        <div class="progress">
            <i id="modelBar" style="width:10%"></i>
        </div>

    </div>

    <div class="live-bottom">

        <button class="live-btn" onclick="captureFrame()">
            📸 Зберегти
        </button>

        <button
            id="scanButton"
            class="live-btn primary"
            onclick="toggleScanning()">
            ⏺ Сканувати
        </button>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   DATABASE
========================================================= */

const DB_KEY = "findhome_ai_database_v2";

let db = null;
let currentPage = "home";

let aiModel = null;
let aiLoading = false;
let scanning = false;
let cameraStream = null;
let detectionTimer = null;

let lastPredictions = [];
let lastDetectionTime = 0;

const icons = {
    "Телефон":"📱",
    "Ключ":"🔑",
    "Ключі":"🔑",
    "Навушники":"🎧",
    "Рюкзак":"🎒",
    "Гаманець":"👛",
    "Пульт":"🎮",
    "Зарядка":"🔌",
    "Документи":"📄",
    "Кросівки":"👟",
    "Ноутбук":"💻",
    "Годинник":"⌚",
    "Пляшка":"🧴",
    "Книга":"📚",
    "Парасолька":"☂️"
};

function uid(){
    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }

    return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function saveDB(){
    localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function loadDB(){
    try{
        const raw = localStorage.getItem(DB_KEY);

        if(!raw){
            return null;
        }

        return JSON.parse(raw);
    }catch{
        return null;
    }
}

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function currentHome(){
    if(!db || !db.homes.length){
        return null;
    }

    let home = db.homes.find(x=>x.id===db.currentHomeId);

    if(!home){
        home = db.homes[0];
        db.currentHomeId = home.id;
        saveDB();
    }

    return home;
}

function allObjects(home=currentHome()){
    if(!home){
        return [];
    }

    return home.rooms.flatMap(room =>
        room.objects.map(object=>({
            ...object,
            roomId:room.id,
            roomName:room.name
        }))
    );
}

function roomById(id){
    const home = currentHome();

    return home?.rooms.find(room=>room.id===id);
}

function objectById(id){
    return allObjects().find(object=>object.id===id);
}

function showToast(message){
    const element = document.getElementById("toast");

    element.textContent = message;
    element.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(()=>{
        element.classList.remove("show");
    },2500);
}

/* =========================================================
   INITIALIZATION
========================================================= */

function defaultDB(){
    return {
        currentHomeId:null,

        homes:[],

        settings:{
            aiLive:true,
            automaticAdd:false,
            threshold:80,
            showConfidence:true,
            showNames:true,
            saveFrames:true,
            updateLocation:true
        }
    };
}

function init(){

    db = loadDB();

    if(!db){
        db = defaultDB();
    }

    updateAIStatus();

    if(!db.homes.length){
        showOnboarding();
    }else{
        render();
    }

    loadAIModel();
}

function showOnboarding(){
    document
        .getElementById("onboarding")
        .classList.add("show");
}

function hideOnboarding(){
    document
        .getElementById("onboarding")
        .classList.remove("show");
}

/* =========================================================
   HOMES
========================================================= */

function createFirstHome(){

    const input = document.getElementById("firstHomeName");

    const name = input.value.trim() || "Мій дім";

    const home = {
        id:uid(),
        name,
        rooms:[]
    };

    db.homes.push(home);
    db.currentHomeId = home.id;

    saveDB();

    hideOnboarding();

    render();

    setTimeout(()=>{
        addRoom();
    },300);
}

function createHome(){

    const name = prompt(
        "Назва нового дому:",
        "Новий дім"
    );

    if(!name || !name.trim()){
        return;
    }

    const home = {
        id:uid(),
        name:name.trim(),
        rooms:[]
    };

    db.homes.push(home);
    db.currentHomeId = home.id;

    saveDB();

    render();

    showToast("Дім створено");
}

function switchHome(){

    const options = db.homes
        .map((home,index)=>`${index+1}. ${home.name}`)
        .join("\n");

    const value = prompt(
        "Оберіть номер дому:\n\n"+options
    );

    if(value===null){
        return;
    }

    const index = Number(value)-1;

    if(!db.homes[index]){
        showToast("Невірний номер");
        return;
    }

    db.currentHomeId = db.homes[index].id;

    saveDB();

    render();
}

function renameHome(){

    const home = currentHome();

    const name = prompt(
        "Нова назва:",
        home.name
    );

    if(!name || !name.trim()){
        return;
    }

    home.name = name.trim();

    saveDB();

    render();
}

/* =========================================================
   ROOMS
========================================================= */

function addRoom(){

    const name = prompt(
        "Назва кімнати:",
        "Спальня"
    );

    if(!name || !name.trim()){
        return;
    }

    const iconsList = [
        "🛏️",
        "🍳",
        "🛋️",
        "🚪",
        "🛁",
        "🌿",
        "🏠"
    ];

    const icon =
        iconsList[currentHome().rooms.length % iconsList.length];

    currentHome().rooms.push({
        id:uid(),
        name:name.trim(),
        description:"",
