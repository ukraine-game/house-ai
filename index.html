<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FindHome AI</title>
<style>
:root{--bg:#f3f5fb;--cd:#fff;--tx:#12141c;--mu:#6b7280;--ac:#5b6cff;--bd:#e3e6ef;--ok:#16a34a;--wr:#d97706;--lo:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0f17;--cd:#171a26;--tx:#eef0f7;--mu:#8b92a7;--bd:#262a3a}}
:root[data-theme=dark]{--bg:#0d0f17;--cd:#171a26;--tx:#eef0f7;--mu:#8b92a7;--bd:#262a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto}
#m{flex:1;overflow:auto;padding:16px 16px 24px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}input[type=checkbox]{width:22px;height:22px}
.p{background:var(--ac);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600}.g{padding:12px 18px;border-radius:12px;background:var(--bd)}
.ic{width:44px;height:44px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-size:18px;flex:none}
.hd,.sb,.sec,.row,.r{display:flex;align-items:center;gap:10px}.hd{margin-bottom:12px}.hd select{font-weight:700;font-size:18px;border:0;background:none;padding:6px 0}
.sb{margin-bottom:12px}.sb input{padding:16px;font-size:16px;border-radius:16px}
.big{width:100%;margin:6px 0 18px;padding:18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#5b6cff,#22b8e8);font-size:18px;font-weight:700;text-align:left;box-shadow:0 8px 24px #5b6cff44}.big small{display:block;font-weight:400;opacity:.85;font-size:13px}
.sec{justify-content:space-between;font-weight:700;margin:6px 0 10px}.lk{color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rc,.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;cursor:pointer;transition:transform .15s}.rc:active{transform:scale(.97)}
.rc span{font-size:26px;display:block}.rc small,.mu{color:var(--mu)}.card{display:flex;gap:12px;margin-bottom:10px;align-items:center}.card img,.th{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--bd);display:grid;place-items:center;font-size:24px}
.card p{margin:2px 0}.bd{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);white-space:nowrap}.bd.ok{color:var(--ok)}.bd.wr{color:var(--wr)}.bd.lo{color:var(--lo)}
#nav{display:flex;border-top:1px solid var(--bd);background:var(--cd)}#nav button{flex:1;padding:10px 0;font-size:11px;color:var(--mu)}#nav button.on{color:var(--ac);font-weight:700}#nav i{display:block;font-style:normal;font-size:20px}
.ob{text-align:center;padding-top:15vh}.ob .logo{font-size:56px}.ob input{margin:12px 0}
.chips{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.chips button{padding:6px 14px;border-radius:99px;background:var(--cd);border:1px solid var(--bd);white-space:nowrap}.chips .on{background:var(--ac);color:#fff}
.row{justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)}.row input,.row select{width:auto}
.ov{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:90%;overflow:auto;animation:in .2s}.sh label{display:grid;gap:4px;color:var(--mu);font-size:13px}.r{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90%}#toast.on{opacity:1}
#live{position:fixed;inset:0;background:#000;z-index:20;color:#fff}#live video,#live canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#live .top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(#000a,transparent)}
#live .top b{flex:1}.pill{padding:4px 10px;border-radius:99px;background:#0008;font-size:12px}#fps{font-size:11px;opacity:.8}
#live select{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:12px;width:auto;background:#000a;color:#fff;border-color:#fff3;padding:8px 12px}
#lmsg{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);color:var(--tx)}#lmsg .card{margin:0;background:#171a26f0;color:#eef0f7;border-color:#fff2;flex-wrap:wrap}
#live .bot{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;background:linear-gradient(transparent,#000b)}
#live .bot button{flex:1;padding:14px 6px;border-radius:14px;background:#ffffff22;color:#fff;font-weight:600;backdrop-filter:blur(8px)}#live .bot .rec{background:#e11d48}
.zb{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:8px;justify-items:center}.zb button{width:42px;height:42px;border-radius:50%;background:#ffffff22;color:#fff;backdrop-filter:blur(8px);font-size:18px}
.kr{padding:10px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center}.kr b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.kr input{width:20px;height:20px}
#vd{transform-origin:center}.lb{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center;touch-action:none;overflow:hidden}.lb img{max-width:100%;max-height:100%;object-fit:contain}.lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border-radius:50%;background:#ffffff26;color:#fff;font-size:20px}.lb span{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:#fffa;font-size:12px}.zm{cursor:zoom-in}</style></head><body><div id="app"><main id="m"></main>
<nav id="nav"><button data-a="tab" data-t="home"><i>🏠</i>Головна</button><button data-a="live"><i>📷</i>AI-Live</button><button data-a="tab" data-t="items"><i>📦</i>Предмети</button><button data-a="tab" data-t="hist"><i>🕘</i>Історія</button><button data-a="tab" data-t="set"><i>⚙️</i>Налаштування</button></nav></div>
<div id="live" hidden><video id="vd" playsinline muted autoplay></video><canvas id="cv"></canvas>
<div class="top"><button data-a="lx" class="pill">← Назад</button><b>AI-Live</b><span id="fps"></span><span id="lst" class="pill">⏳</span></div>
<select id="lroom"></select><div class="zb"><button data-a="cloud" id="cb">☁️</button><button data-a="torch">🔦</button><button data-a="native">🖼</button><button data-a="zi">＋</button><span id="zl" class="pill">1×</span><button data-a="zo">－</button></div><div id="lmsg"></div>
<div class="bot"><button data-a="mic">🎙 AI</button><button data-a="snap">📸 Зберегти</button><button data-a="scan" id="scb">⏺ Сканувати</button></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),dpr=window.devicePixelRatio||1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const db=new Promise((res,rej)=>{const r=indexedDB.open('findhome',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const idbGet=k=>tx('readonly',s=>s.get(k)),idbPut=(k,v)=>tx('readwrite',s=>s.put(v,k)),idbDel=k=>tx('readwrite',s=>s.delete(k));
const putBlob=async b=>{const id=uid();await idbPut('b:'+id,b);return id},getBlob=id=>idbGet('b:'+id);
const toBlob=d=>{const a=d.split(','),b=atob(a[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:'image/jpeg'})};
const rmB=its=>its.forEach(i=>[i.full,...i.history.map(x=>x.full)].filter(Boolean).forEach(id=>idbDel('b:'+id)));
const DS={live:1,auto:0,min:80,pct:1,names:1,frames:1,upd:1,debug:0,modelUrl:'',perf:'auto',cloudAuto:0,prev:'low',cloudHi:0};
let S={homes:[],cur:null,set:{},dirty:0,keys:[],active:null,consent:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('findhome')||'{}'))}catch(e){}
S.set=Object.assign({},DS,S.set);
let st;const save=()=>{S.dirty++;clearTimeout(st);st=setTimeout(()=>idbPut('state',S).then(()=>{try{localStorage.removeItem('findhome')}catch(e){}}).catch(()=>{try{localStorage.setItem('findhome',JSON.stringify(S))}catch(e){toast('Сховище переповнене')}}),150)};
const H=()=>S.homes.find(h=>h.id==S.cur)||S.homes[0],R=id=>H().rooms.find(r=>r.id==id),rn=id=>R(id)?.name||'—';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)};
const ft=t=>{if(!t)return'—';const d=new Date(t),n=new Date(),dd=Math.round((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);return(dd==0?'сьогодні':dd==1?'вчора':d.toLocaleDateString('uk'))+' о '+d.toLocaleTimeString('uk',{hour:'2-digit',minute:'2-digit'})};
const pl=n=>n+(n%10==1&&n%100!=11?' предмет':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?' предмети':' предметів');
const ri=n=>{n=n.toLowerCase();return n.includes('спальн')?'🛏':n.includes('кухн')?'🍳':n.includes('віталь')?'🛋':n.includes('корид')?'🚪':n.includes('ван')?'🛁':n.includes('балкон')?'🌿':'🏠'};
const lv=c=>c>=90?['Висока впевненість','ok']:c>=70?['Середня впевненість','wr']:['Низька впевненість','lo'];
const shrink=async(f,m=400)=>{try{const b=await createImageBitmap(f,{resizeWidth:m,resizeQuality:'medium'}),c=document.createElement('canvas');c.width=b.width;c.height=b.height;c.getContext('2d').drawImage(b,0,0);b.close();return c.toDataURL('image/jpeg',.72)}catch(e){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)})}};
function form(t,f,cb){const d=document.createElement('div');d.className='ov';
d.innerHTML=`<form class=sh><h3 style="margin:0">${t}</h3>${f.map(x=>`<label>${x.l}${x.t=='area'?`<textarea name=${x.k} rows=3>${esc(x.v)}</textarea>`:x.t=='sel'?`<select name=${x.k}>${x.o.map(o=>`<option value="${o[0]}" ${o[0]==x.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:x.t=='file'?`<input type=file name=${x.k} accept="image/*">`:`<input name=${x.k} value="${esc(x.v)}">`}</label>`).join('')}<div class=r><button type=button class=g>Скасувати</button><button class=p>Зберегти</button></div></form>`;
document.body.appendChild(d);const fm=d.firstChild;d.onclick=e=>{if(e.target==d||e.target.classList.contains('g'))d.remove()};
fm.onsubmit=async e=>{e.preventDefault();const v={};for(const x of f){const el=fm.elements[x.k];v[x.k]=x.t=='file'?(el.files[0]?await shrink(el.files[0]):null):el.value;if(x.t=='file')v[x.k+'Full']=el.files[0]||null}d.remove();cb(v)}}
/* ---------- пошук ---------- */
const STOP=new Set('де мій моя моє мої мою покажи показати забув забула залишив залишила останнє останній місце коли востаннє бачили бачив яка який якій кімнаті знаходиться лежить цей ця це що'.split(' '));
const tk=s=>s.toLowerCase().split(/[^а-яіїєґa-z0-9']+/).filter(w=>w.length>2);
function itemAns(i){const l=i.lastSeen?lv(i.conf||0):null;return`<div class=card data-a=iopen data-id=${i.id}>${i.photo?`<img src="${i.photo}">`:'<div class=th>📦</div>'}<div><b>«${esc(i.name)}» — ${esc(rn(i.roomId))}</b>${i.desc?`<p>${esc(i.desc)}</p>`:''}<p class=mu>${i.lastSeen?`Зафіксовано ${ft(i.lastSeen)} · ${Math.round(i.conf||0)}% <span class="bd ${l[1]}">${l[0]}</span>`:'Додано вручну, AI ще не бачив цей предмет'}</p></div></div>`}
function answer(q){const ws=tk(q).filter(w=>!STOP.has(w)).map(w=>w.slice(0,4));if(!ws.length)return'';
const r=H().items.map(i=>{const a=tk(i.name).map(w=>w.slice(0,4)),b=tk(i.desc||'').map(w=>w.slice(0,4));return[i,ws.filter(w=>a.includes(w)).length*2+ws.filter(w=>b.includes(w)).length]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
return r.length?r.map(x=>itemAns(x[0])).join(''):`<div class=card style="cursor:default">Я поки не знаю, де знаходиться цей предмет. Спробуйте просканувати будинок через AI-Live.</div>`}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function voice(cb){if(!SR)return toast('Голосове введення не підтримується');const r=new SR();r.lang='uk-UA';r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>toast('Не вдалось розпізнати голос');r.start();toast('Слухаю…')}
/* ---------- екрани ---------- */
const V={tab:'home',room:null,item:null,q:'',ans:'',flt:''};
const homeV=h=>`<div class=hd><select data-sw>${S.homes.map(x=>`<option value=${x.id} ${x.id==h.id?'selected':''}>${esc(x.name)}</option>`)}</select><button class=ic data-a=hnew2>＋</button></div>
<form class=sb><input id=q placeholder="🔍 Що ви шукаєте?" value="${esc(V.q)}"><button type=button class=ic data-a=mics>🎙</button></form>${V.ans}
<button class=big data-a=live>📷 AI-Live<small>Скануйте кімнату камерою</small></button>
<button class=g data-a=vid style="width:100%;margin:-6px 0 16px">🎞 Аналіз відео з кімнати</button><div class=sec>Кімнати <button class=lk data-a=radd>＋ Додати</button></div><div class=grid>${h.rooms.map(r=>`<div class=rc data-a=ropen data-id=${r.id}><span>${ri(r.name)}</span><b>${esc(r.name)}</b><br><small>${pl(h.items.filter(i=>i.roomId==r.id).length)}</small></div>`).join('')||'<p class=mu>Додайте першу кімнату</p>'}</div>`;
const rowI=i=>{const l=lv(i.conf||0);return`<div class=card data-a=iopen data-id=${i.id}>${i.photo?`<img src="${i.photo}">`:'<div class=th>📦</div>'}<div style="flex:1"><b>${esc(i.name)}</b><p class=mu>${esc(rn(i.roomId))} · ${ft(i.lastSeen||i.created)}</p></div>${i.lastSeen?`<span class="bd ${l[1]}">${Math.round(i.conf)}%</span>`:''}</div>`};
const roomV=h=>{const r=R(V.room),its=h.items.filter(i=>i.roomId==r.id);return`<div class=hd><button class=ic data-a=back>←</button><h2 style="flex:1;margin:0">${ri(r.name)} ${esc(r.name)}</h2><button class=ic data-a=redit>✎</button><button class=ic data-a=rdel>🗑</button></div>${r.photo?`<img class=zm data-f="${r.full||''}" src="${r.photo}" style="width:100%;border-radius:16px;margin-bottom:10px">`:''}<p class=mu>${esc(r.description||'')}</p><div class=sec>${pl(its.length)}<button class=lk data-a=iadd>＋ Предмет</button></div>${its.map(rowI).join('')||'<p class=mu>Порожньо</p>'}`};
const itemsV=h=>`<h2>Предмети</h2><div class=chips><button class="${V.flt?'':'on'}" data-a=flt data-id="">Усі</button>${h.rooms.map(r=>`<button class="${V.flt==r.id?'on':''}" data-a=flt data-id=${r.id}>${esc(r.name)}</button>`).join('')}</div>${h.items.filter(i=>!V.flt||i.roomId==V.flt).map(rowI).join('')||'<p class=mu>Предметів ще немає</p>'}<button class=p data-a=iadd style="width:100%">＋ Додати предмет</button>`;
const histV=h=>{const o=h.items.flatMap(i=>i.history.map(x=>({...x,n:i.name,id:i.id}))).sort((a,b)=>b.ts-a.ts).slice(0,100);return`<h2>Історія спостережень</h2>${o.map(x=>`<div class=card data-a=iopen data-id=${x.id}>${x.image?`<img class=zm data-f="${x.full||''}" src="${x.image}">`:'<div class=th>👁</div>'}<div><b>${esc(x.n)}</b><p class=mu>${ft(x.ts)}<br>${esc(rn(x.roomId))} · ${Math.round(x.conf)}% · ${x.source}</p></div></div>`).join('')||'<p class=mu>Спостережень ще немає. Запустіть AI-Live.</p>'}`};
const itemV=h=>{const i=h.items.find(x=>x.id==V.item);return`<div class=hd><button class=ic data-a=back>←</button><h2 style="flex:1;margin:0">${esc(i.name)}</h2><button class=ic data-a=iph>📷</button><button class=ic data-a=iedit>✎</button><button class=ic data-a=idel>🗑</button></div>${i.photo?`<img class=zm data-f="${i.full||''}" src="${i.photo}" style="width:100%;border-radius:16px;margin-bottom:10px">`:''}<p><b>${esc(rn(i.roomId))}</b><br>${esc(i.desc||'')}</p><p class=mu>Створено ${ft(i.created)}${i.lastSeen?` · остання впевненість ${Math.round(i.conf)}%`:''}</p><div class=sec>Історія</div>${i.history.map(x=>`<div class=card style="cursor:default">${x.image?`<img class=zm data-f="${x.full||''}" src="${x.image}">`:'<div class=th>👁</div>'}<div><b>${ft(x.ts)}</b><p class=mu>${esc(rn(x.roomId))} · ${Math.round(x.conf)}% · ${lv(x.conf)[0]}</p></div></div>`).join('')||'<p class=mu>AI ще не бачив цей предмет</p>'}`};

async function callAI(k,img){let r,j;
if(k.prov=='gemini'){r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${k.model||'gemini-2.5-flash'}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k.key},body:JSON.stringify({contents:[{parts:[{text:PR},{inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});if(!r.ok)throw r.status;j=(await r.json()).candidates[0].content.parts[0].text}
else{r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.key},body:JSON.stringify({model:k.model||'gpt-4o-mini',response_format:{type:'json_object'},messages:[{role:'user',content:[{type:'text',text:PR},{type:'image_url',image_url:{url:img,detail:'low'}}]}]})});if(!r.ok)throw r.status;j=(await r.json()).choices[0].message.content}
return JSON.parse(j).objects||[]}
async function cloudDetect(img){const ks=S.keys,s=Math.max(0,ks.findIndex(k=>k.id==S.active));for(let n=0;n<ks.length;n++){const k=ks[(s+n)%ks.length];try{const r=await callAI(k,img);if(n){S.active=k.id;save();toast('Перемкнено на ключ: '+k.name)}return r}catch(e){}}return null}

async function hiFrame(){const t=stream?.getVideoTracks()[0];if(!t||!window.ImageCapture||(!hw&&zoom>1))return null;try{ic=ic&&ic.track==t?ic:new ImageCapture(t);const bm=await createImageBitmap(await ic.takePhoto({imageWidth:1600}),{resizeWidth:1280}),W=bm.width,Hh=bm.height;cc.width=W;cc.height=Hh;cc.getContext('2d').drawImage(bm,0,0);bm.close();const vw=vd.videoWidth,vh=vd.videoHeight,k=W/Hh,sw=k<=vw/vh?vw:vh*k,sh=k<=vw/vh?vw/k:vh;return{sx:(vw-sw)/2,sy:(vh-sh)/2,sw,sh}}catch(e){return null}}

for(const d of o){const[a,b,c,e]=d.box||[];if(!d.label||![a,b,c,e].every(Number.isFinite)||e<=b||c<=a)continue;const bx=[f.sx+b/1000*f.sw,f.sy+a/1000*f.sh,(e-b)/1000*f.sw,(c-a)/1000*f.sh];if(tracks.some(t=>iou(bx,[t.tx,t.ty,t.tw,t.th])>.3))continue;
const p=old.find(t=>t.k==d.label&&iou(bx,[t.tx,t.ty,t.tw,t.th])>.2),t=p||{k:String(d.label),cloud:1,x:bx[0],y:bx[1],w:bx[2],h:bx[3],n:9,vx:0,vy:0,sh:3};
Object.assign(t,{tx:bx[0],ty:bx[1],tw:bx[2],th:bx[3],sc:Math.min(95,+d.confidence||70),ts:now+2500,b:bx,item:matchItem(d.label)});tracks.push(t)}proc(now)}

{const L=$('#live'),d2=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);let d0=0,z0=1;
L.addEventListener('touchstart',e=>{if(e.touches.length==2){d0=d2(e);z0=zoom}},{passive:true});L.addEventListener('touchmove',e=>{if(e.touches.length==2&&d0)setZoom(z0*d2(e)/d0)},{passive:true});L.addEventListener('touchend',()=>d0=0);L.addEventListener('wheel',e=>setZoom(zoom-e.deltaY/500),{passive:true})}

async function lightbox(img){const o=document.createElement('div');o.className='lb';o.innerHTML=`<img src="${img.src}"><span></span><button>✕</button>`;document.body.appendChild(o);const im=o.firstChild,id=img.dataset.f;let u,z=1,tx=0,ty=0,d0=0,z0=1;const P=new Map(),ap=()=>im.style.transform=`translate(${tx}px,${ty}px) scale(${z})`,dd=()=>{const[a,b]=[...P.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};

function pickVideo(){if(!H().rooms.length)return toast('Спершу додайте кімнату');const i=document.createElement('input');i.type='file';i.accept='video/*';i.onchange=()=>{const f=i.files[0];if(f)form('Аналіз відео',[{k:'roomId',l:'Кімната на відео',t:'sel',o:H().rooms.map(r=>[r.id,r.name]),v:V.room||H().rooms[0].id},{k:'mode',l:'AI',t:'sel',o:[['local','Локальний (безкоштовно, 80 класів)'],...(akey()?[['cloud','Хмарний (точніший, будь-які речі)']]:[])],v:akey()?'cloud':'local'}],v=>vidAnalyze(f,v))};i.click()}
async function vidAnalyze(file,o){const cloud=o.mode=='cloud';if(cloud&&!S.consent&&!confirm('Кадри відео буде надіслано провайдеру AI. Продовжити?'))return;if(cloud){S.consent=1;save()}
const ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class=sh><h3 style="margin:0">Аналіз відео</h3><div id=vp class=mu>Підготовка…</div><div style="height:8px;background:var(--bd);border-radius:9px;overflow:hidden"><div id=vb style="height:100%;width:0;background:var(--ac);transition:.2s"></div></div><div class=r><button class=g id=vc>Скасувати</button></div></div>';document.body.appendChild(ov);let stop=0;$('#vc').onclick=()=>{stop=1};
const v=document.createElement('video'),u=URL.createObjectURL(file),C=new Map();v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
try{await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=()=>j('Не вдалось відкрити відео')});if(!cloud){await loadModel();if(!M)throw'Локальна модель недоступна'}
const dur=v.duration,step=cloud?Math.max(3,dur/20):Math.max(1,dur/120),tot=Math.ceil(dur/step);let n=0;
for(let t=step/2;t<dur&&!stop;t+=step){v.currentTime=t;await new Promise(r=>v.onseeked=r);let L;
if(cloud){const f=grab(Math.min(1280,v.videoWidth),cc,v,1),r=await cloudDetect(cc.toDataURL('image/jpeg',.85));if(!r)throw'Хмарний AI недоступний';L=r.filter(d=>d.label&&(d.box||[]).length==4).map(d=>({name:String(d.label),sc:+d.confidence||70,b:[d.box[1]/1000*f.sw,d.box[0]/1000*f.sh,(d.box[3]-d.box[1])/1000*f.sw,(d.box[2]-d.box[0])/1000*f.sh]}))}
else{const f=grab(640,dc,v,1);L=(await M.detect(f.c,15)).filter(d=>d.class!='person'&&d.score>=.45).map(d=>({name:UK[d.class]||d.class,sc:d.score*100,b:d.bbox.map(q=>q/f.k)}))}
for(const d of L){if(!(d.b[2]>0&&d.b[3]>0))continue;const key=stems(d.name).join(''),cx=(d.b[0]+d.b[2]/2)/v.videoWidth,cy=(d.b[1]+d.b[3]/2)/v.videoHeight;let c=C.get(key);if(!c)C.set(key,c={name:d.name,n:0,sum:0,times:[],best:null});c.n++;c.sum+=d.sc;c.times.push(t);const q=d.sc+d.b[2]*d.b[3]/(v.videoWidth*v.videoHeight)*20;

$('#vp').textContent=`Кадр ${++n}/${tot} · знайдено: ${C.size}`;$('#vb').style.width=n/tot*100+'%';await sleep(0)}

function draw(){if(!running)return;const W=cv.clientWidth,Hh=cv.clientHeight;if(cv.width!=W*dpr){cv.width=W*dpr;cv.height=Hh*dpr}const x=cv.getContext('2d'),now=performance.now();x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,Hh);
